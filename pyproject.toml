[project]
name = "jev-plays-pokemon"
version = "0.1.0"
description = "Pokemon Red on PyBoy where a decision model picks at the branches"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = ["pyboy>=2.2", "pygame>=2.6"]

[project.scripts]
jpp = "jpp.cli:main"
measure = "jpp.measure:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jpp"]
