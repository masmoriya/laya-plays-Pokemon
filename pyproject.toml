[project]
name = "laya-plays-pokemon"
version = "0.1.0"
description = "Pokemon Red on PyBoy where a decision model picks at the branches"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = ["Pillow>=10", "laya>=0.3.4,<0.4", "pyboy>=2.2", "pygame>=2.6"]

[project.scripts]
lpp = "jpp.cli:main"
jpp = "jpp.cli:main"
measure = "jpp.measure:main"
laya-sidecar = "jpp.laya_sidecar:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jpp"]

[tool.hatch.build.targets.wheel.force-include]
"config/gold97_route.tsv" = "jpp/resources/gold97_route.tsv"
"config/gold97_maps.tsv" = "jpp/resources/gold97_maps.tsv"
"config/gold97_moves.tsv" = "jpp/resources/gold97_moves.tsv"
"config/gold97_items.tsv" = "jpp/resources/gold97_items.tsv"
"config/gold97_policy.json" = "jpp/resources/gold97_policy.json"
"config/game_rules.json" = "jpp/resources/game_rules.json"
"config/jev_animations.json" = "jpp/resources/jev_animations.json"
"config/jev_sprites.json" = "jpp/resources/jev_sprites.json"
"assets/jev/jev-spritesheet.png" = "jpp/resources/assets/jev/jev-spritesheet.png"
